# Build, test and preview nosheet in the same Node 24 image as .devcontainer/devcontainer.json.
#
#   docker compose -f .docker/compose.yaml run --rm build    # install, lint, test, build
#   docker compose -f .docker/compose.yaml up examples       # serve examples/ on http://localhost:8181
#   docker compose -f .docker/compose.yaml run --rm publish  # check, build, npm login, npm publish
#                                       ... run --rm publish --dry-run   # same, but publish nothing
#
# The repo is bind-mounted, so dist/ and examples/js/ are written straight back to the host.
name: nosheet

x-node: &node
  image: mcr.microsoft.com/devcontainers/javascript-node:24
  working_dir: /workspace
  volumes:
    - ..:/workspace
    # Linux node_modules live in a named volume so they never clobber the host's node_modules.
    - node_modules:/workspace/node_modules

services:
  build:
    <<: *node
    command: bash .docker/build.sh

  publish:
    <<: *node
    # An entrypoint (not a command) so arguments after `run --rm publish` reach `npm publish`.
    entrypoint: ["bash", ".docker/publish.sh"]

  examples:
    <<: *node
    command: python3 -m http.server 8181 --directory examples
    ports:
      - "127.0.0.1:8181:8181"

volumes:
  node_modules:
